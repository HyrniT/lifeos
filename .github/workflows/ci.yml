# =============================================================================
#  The gate. Everything that can fail before a deploy fails here instead.
#
#  Free-tier minutes are not free of consequence, so the two halves run in
#  parallel and both cache their dependencies.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The tests start their own Postgres (io.zonky embedded-postgres), so no
      # service container is declared here. That is deliberate: the same command
      # runs identically on a laptop with no Docker.
      - name: Test
        working-directory: backend
        run: mvn -B verify

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Web — typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        # Same-origin default. Vercel builds with its own VITE_API_BASE_URL; this
        # only has to prove the bundle compiles.
        run: npm run build

  docker:
    name: Backend — the image Render will build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A Dockerfile that only breaks on Render is a broken deploy with a ten
    # minute feedback loop. Build it here, on the same commit.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: lifeos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
